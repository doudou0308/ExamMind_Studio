name: Build and publication checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_publication.py
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exam_web/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: exam_web/backend/pom.xml
      - run: mvn --batch-mode verify
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exam_web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: exam_web/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
